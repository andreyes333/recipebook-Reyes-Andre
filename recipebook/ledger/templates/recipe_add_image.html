{% extends 'base.html' %}

{% block body %}
    <h3>Add New Image to {{ recipe.name }}</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Update Recipe">
    </form>
    <hr>
    <a href="{% url 'ledger:recipe-detail' pk=recipe.pk %}">Back to {{ recipe.name }}</a>
{% endblock %}
