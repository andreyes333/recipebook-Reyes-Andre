{% extends 'base.html' %}

{% block content %}
<head>
    <title>
        Recipe List
    </title>
</head>
<ul>
    {% for recipe in recipe_list %}
            <li>
                <nav>
                    <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
                </nav>
            </li>
    {% endfor %}
</ul>
{% endblock %}
