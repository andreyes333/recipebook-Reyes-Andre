{% extends 'base.html' %}

{% block body %}
<body>
<head>
    <title>
        Recipe List
    </title>
</head>
<ul>
    {% for recipe in recipe_list %}
            <li>
                <nav>
                    <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
                </nav>
            </li>
    {% endfor %}
</ul>
<a href="{% url 'ledger:recipe-add' %}">Create New Recipe</a>
</body>
{% endblock %}
