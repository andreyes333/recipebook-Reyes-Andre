<html>
<head>
    <title>Password Reset</title>
</head>
<body>
    <h2>Password Reset Confirm</h2>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Change password">
        </form>
    {% else %}
        <p>Invalid password reset link</p>
    {% endif %}
</body>
</html>
